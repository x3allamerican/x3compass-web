name: prompt-eval-weekly

# Every Monday 09:00 UTC, query compass_prompt_eval_weekly aggregation view
# and post a GitHub issue with the top patterns:
#   - Which categories have the worst citation quality
#   - Which had the highest unverified-citation rate
#   - Customer ratings trend (when feedback is captured)
#
# This is the weekly source of truth for what the system prompt needs to
# fix next. Drives the patch cycle described in the prompt-intelligence
# framework Joshua shared.

on:
  schedule:
    - cron: '0 9 * * 1'   # Monday 09:00 UTC = 04:00 ET
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: gate
        run: |
          [ -f AGENT_SAFETY.md ] || { echo "::error::AGENT_SAFETY.md missing"; exit 1; }

      - name: query and post weekly insights
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        uses: actions/github-script@v7
        with:
          script: |
            const SUPABASE_URL = process.env.SUPABASE_URL;
            const SVC = process.env.SUPABASE_SERVICE_ROLE;
            if (!SUPABASE_URL || !SVC) {
              console.log('Supabase secrets not configured — skipping');
              return;
            }

            // Pull the last week's aggregation
            const fetchSb = async (path) => {
              const r = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
                headers: { apikey: SVC, Authorization: `Bearer ${SVC}` },
              });
              if (!r.ok) throw new Error(`Supabase HTTP ${r.status}`);
              return r.json();
            };

            // 1 week of aggregated category metrics
            const weeklyView = await fetchSb('compass_prompt_eval_weekly?week=gte.' + new Date(Date.now()-7*24*60*60*1000).toISOString().slice(0,10));
            // Raw rows from the last week to surface the actual hallucinated citations
            const since = new Date(Date.now()-7*24*60*60*1000).toISOString();
            const halls = await fetchSb(`compass_prompt_eval?created_at=gte.${since}&unverified_count=gt.0&select=user_question,question_category,unverified_citations,cited_sections,citation_quality_score&limit=20`);
            const total = await fetchSb(`compass_prompt_eval?created_at=gte.${since}&select=id&limit=1000`);

            const lines = [];
            lines.push(`## Compass Prompt Intelligence — Week of ${new Date().toISOString().slice(0,10)}`);
            lines.push('');
            lines.push(`**Total /api/ask calls (last 7 days):** ${total.length}`);
            lines.push(`**Calls with at least one unverified citation:** ${halls.length}`);
            lines.push('');
            if (weeklyView.length > 0) {
              lines.push('### By category');
              lines.push('| Category | Volume | Unverified | Avg quality | Avg ms | Avg rating |');
              lines.push('|---|---:|---:|---:|---:|---:|');
              for (const r of weeklyView) {
                lines.push(`| ${r.question_category||'?'} | ${r.total_questions} | ${r.had_unverified_citations||0} | ${r.avg_citation_quality??'—'} | ${r.avg_response_ms??'—'} | ${r.avg_customer_rating??'—'} |`);
              }
              lines.push('');
            }
            if (halls.length > 0) {
              lines.push('### Top hallucinated-citation cases (drives the next prompt fix)');
              for (const h of halls.slice(0, 10)) {
                lines.push(`- **${h.question_category||'?'}** — q: \`${(h.user_question||'').slice(0,100).replace(/\n/g,' ')}\``);
                lines.push(`  - cited: ${(h.cited_sections||[]).join(', ')}`);
                lines.push(`  - **unverified:** ${(h.unverified_citations||[]).join(', ')}`);
                lines.push(`  - quality: ${h.citation_quality_score}`);
              }
              lines.push('');
              lines.push('**Recommended action:** for each category above with avg quality < 0.9, split the system prompt with a category-specific addendum that explicitly lists the canonical CFR sections.');
            } else {
              lines.push('✓ Zero hallucinated citations this week.');
            }
            lines.push('');
            lines.push('---');
            lines.push('_Auto-generated by `.github/workflows/prompt-eval-weekly.yml`. The X3 CEO operating standard: every week ends with the system prompt knowing more than it did the week before._');

            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `[prompt-eval] Weekly intelligence — ${new Date().toISOString().slice(0,10)}`,
              body: lines.join('\n'),
              labels: ['prompt-eval', 'weekly-report'],
            });
