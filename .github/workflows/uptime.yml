name: uptime-check
on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: hit /api/health
        id: ping
        run: |
          set -e
          BODY=$(curl -sf --max-time 15 https://x3compass-web.pages.dev/api/health)
          echo "body=$BODY" >> $GITHUB_OUTPUT
          OK=$(echo "$BODY" | python3 -c "import json,sys;print(json.load(sys.stdin).get('ok',False))")
          if [ "$OK" != "True" ]; then
            echo "Health check failed: $BODY"
            exit 1
          fi
          echo "✓ healthy: $BODY"

      - name: file issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Uptime alert: /api/health returned non-OK at ${new Date().toISOString()}`;
            // dedupe: don't open a new issue if one is already open
            const open = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open label:uptime-alert`,
            });
            if (open.data.total_count > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open.data.items[0].number,
                body: `Still failing at ${new Date().toISOString()}. Workflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title,
              labels: ["uptime-alert", "incident"],
              body: `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nSee RUNBOOK.md for incident response.`,
            });

      - name: auto-close uptime issues on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const open = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open label:uptime-alert`,
            });
            for (const issue of open.data.items) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: `✓ Resolved — /api/health is back to operational at ${new Date().toISOString()}.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: "closed",
              });
            }
