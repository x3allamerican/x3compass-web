name: uptime
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: synthetic monitoring (P1 + P2 + P3)
        id: monitor
        continue-on-error: true   # workflow itself never fails — silences GitHub default failure emails
        env:
          MONITOR_SECRET: ${{ secrets.MONITOR_SECRET }}
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error, time, os
          # Probe the canonical production hostname. The Pages preview hostname
          # is not the public routing contract and can have different edge/WAF
          # behavior (including stale route objects).
          BASE = "https://x3compass.com"
          MONITOR_SECRET = os.environ.get("MONITOR_SECRET", "")
          if not MONITOR_SECRET:
              raise RuntimeError("MONITOR_SECRET repository/org secret is required for synthetic monitoring")
          # severity, label, method, path, expected_status, body, headers
          # P1 = customer-facing critical (signup/checkout must work)
          # P2 = product-facing important (app pages, health)
          # P3 = nice-to-have (marketing pages)
          probes = [
            ("P1", "homepage",       "GET",  "/",                              {200}, None, "public"),
            ("P1", "signup",         "GET",  "/signup/",                       {200}, None, "public"),
            ("P1", "signin",         "GET",  "/signin/",                       {200}, None, "public"),
            ("P1", "pricing",        "GET",  "/pricing/",                      {200}, None, "public"),
            ("P1", "api_health",     "GET",  "/api/health",                    {200}, "ok=true", "public"),
            ("P1", "checkout_auth",  "POST", "/api/stripe/create-checkout-session", {401, 403}, '{"plan":"diy"}', "auth-required"),
            ("P1", "post_signup_auth","POST","/api/auth/post-signup",          {401, 403}, "{}", "auth-required"),
            ("P2", "app_dashboard",  "GET",  "/app/",                          {200}, None, "public"),
            ("P2", "skills_catalog", "GET",  "/skills/",                       {200}, None, "public"),
            ("P2", "background",     "GET",  "/app/background-checks/",        {200}, None, "public"),
            ("P3", "sitemap",        "GET",  "/sitemap.xml",                   {200}, None, "public"),
            ("P3", "robots",         "GET",  "/robots.txt",                    {200}, None, "public"),
            ("P3", "hub",            "GET",  "https://x3fleetsafety.com/",     {200}, None, "public"),
            ("P3", "archive",        "GET",  "https://archive.x3fleetsafety.com/", {200}, None, "public"),
          ]
          def hit(method, url, body):
              data = body.encode() if body and not body.startswith("ok=") else None
              headers = {"X-Monitor-Secret": MONITOR_SECRET}
              if data:
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              t0 = time.time()
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      ms = round((time.time()-t0)*1000)
                      txt = r.read().decode("utf-8","replace")[:300]
                      return r.status, txt, ms, None
              except urllib.error.HTTPError as e:
                  ms = round((time.time()-t0)*1000)
                  body = e.read().decode("utf-8","replace")[:300] if e.fp else ""
                  return e.code, body, ms, None
              except Exception as e:
                  return 0, "", round((time.time()-t0)*1000), str(e)

          # 3 attempts per probe with 10s spacing — survives deploy swap windows
          results = []
          for sev, label, method, path, expected_codes, expect_body, classification in probes:
              url = path if path.startswith("http") else f"{BASE}{path}"
              attempts = 0
              while True:
                  attempts += 1
                  code, body, ms, err = hit(method, url, expect_body if expect_body and not expect_body.startswith("ok=") else None)
                  ok = code in expected_codes and (not (expect_body and expect_body.startswith("ok=")) or "true" in body.lower())
                  if ok or attempts >= 3:
                      break
                  time.sleep(10)
              results.append({"sev": sev, "label": label, "url": url, "expect": sorted(expected_codes), "classification": classification, "got": code, "ms": ms, "ok": ok, "err": err, "attempts": attempts, "snippet": body[:200] if not ok else ""})

          failures = {"P1": [], "P2": [], "P3": []}
          for r in results:
              status = "✓" if r["ok"] else "✗"
              print(f'  {status} {r["sev"]} {r["label"]:18}  {r["got"]:>3} (want {r["expect"]}) [{r["classification"]}]  {r["ms"]:>4}ms  attempts={r["attempts"]}  {r["url"]}')
              if not r["ok"]:
                  failures[r["sev"]].append(r)

          # write summary for next step
          with open("/tmp/monitor.json","w") as f:
              json.dump({"results": results, "failures": failures}, f)

          # exit code reflects severity — but step has continue-on-error so workflow never fails
          if failures["P1"]: print(f'::error::P1 failures: {len(failures["P1"])}'); exit(1)
          if failures["P2"]: print(f'::warning::P2 failures: {len(failures["P2"])}'); exit(2)
          if failures["P3"]: print(f'::warning::P3 failures: {len(failures["P3"])}')
          print("ALL OK")
          PY

      - name: open / update incident on P1 failure
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let data;
            try { data = JSON.parse(fs.readFileSync('/tmp/monitor.json','utf8')); }
            catch { console.log('no monitor.json — nothing to report'); return; }

            const p1 = data.failures.P1 || [];
            const p2 = data.failures.P2 || [];

            // Look for existing open uptime issue
            const open = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open label:uptime-alert`,
            });

            if (p1.length === 0 && p2.length === 0) {
              // Everything healthy — auto-close any open incident
              for (const issue of open.data.items) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `✓ Resolved — all probes green at ${new Date().toISOString()}. Auto-closing.`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: issue.number, state: "closed", state_reason: "completed",
                });
              }
              return;
            }

            if (p1.length === 0) {
              // P2-only failure — log via summary, do NOT open an incident (too noisy)
              console.log(`P2 failures: ${p2.map(f=>f.label).join(', ')} — logged only, no issue created`);
              return;
            }

            // P1 failure path — only file/update if persistent
            const severity = p1.length >= 3 ? "P1-CRITICAL" : "P1";
            const title = `[${severity}] ${p1.map(f=>f.label).join(', ')} failed at ${new Date().toISOString()}`;
            const body = [
              `## What's broken`,
              p1.map(f => `- **${f.label}** → got ${f.got} (wanted ${f.expect}), ${f.ms}ms, ${f.attempts} attempts. ${f.url}`).join('\n'),
              p2.length ? `\n## Also degraded (P2)\n${p2.map(f=>`- ${f.label} → ${f.got}`).join('\n')}` : '',
              `\n## What I tried`,
              `- 3 attempts per probe with 10s backoff. Failed all 3.`,
              `\n## Next`,
              `- The 🩺 doctor agent has been triggered. It will diagnose + attempt remediation. Look for its comment in 1-2 minutes.`,
              `- If the doctor can't fix it, this issue gets the \`needs-human\` label.`,
              `\n[Run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) · [Runbook](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/RUNBOOK.md)`
            ].join('\n');

            if (open.data.total_count > 0) {
              const existing = open.data.items[0];
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number,
                body: `### Still failing at ${new Date().toISOString()}\n${p1.map(f=>`- ${f.label}: ${f.got}`).join('\n')}\n[Run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              });
            } else {
              const issue = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body,
                labels: ["uptime-alert", "incident", severity.toLowerCase()],
              });
              console.log(`Filed: ${issue.data.html_url}`);

              // Explicitly trigger the doctor — GITHUB_TOKEN-created issues do NOT
              // cascade via 'issues.opened'/'labeled' triggers (anti-recursion safety).
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner: context.repo.owner, repo: context.repo.repo,
                  workflow_id: 'doctor.yml', ref: 'main',
                  inputs: { issue_number: String(issue.data.number) },
                });
                console.log(`🩺 Doctor dispatched on #${issue.data.number}`);
              } catch (e) {
                console.log(`Doctor dispatch failed (issue still filed): ${e.message}`);
              }
            }
