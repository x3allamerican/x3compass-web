name: playwright
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm" }
      - run: npm ci --no-audit --no-fund
      - name: Source a11y and SEO gate
        run: node --test tests/a11y-seo-source-gate.test.mjs
      - run: npx playwright install --with-deps chromium
      - name: Run fast domain and contract tests
        run: npm run test:unit
      # If we just pushed to main, give Cloudflare ~45s to deploy before testing prod
      - name: wait for deploy
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: sleep 45
      # The deployed browser suite is a post-deploy/main gate. Pull requests
      # do not have a stable Cloudflare preview URL, so probing the canonical
      # site here tests an older deployment instead of the proposed commit.
      - name: Run deployed browser suite
        if: github.event_name != 'pull_request'
        run: npx playwright test
        env:
          PW_BASE_URL: https://x3compass-web.pages.dev
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
