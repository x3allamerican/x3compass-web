name: agent-improvement-monthly

# Closes the framework #5 gap (agent capability expansion tracking).
# Runs the 1st of every month at 09:00 UTC. Reads the last 30 days of
# closed incident issues, categorizes by resolution path, posts a report
# + appends to .doctor/improvement-log.md.
#
# Output: a monthly issue showing whether the doctor is getting smarter
# (more % auto-resolved) and which patterns the doctor still can't handle.

on:
  schedule:
    - cron: '0 9 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: aggregate and report
        uses: actions/github-script@v7
        with:
          script: |
            const since = new Date(Date.now() - 30*24*60*60*1000).toISOString();
            const labels = ['uptime-alert','vendor-health','cloudflare-deploy-failure','client-error-spike','journey-probe-failure'];

            const all = [];
            for (const lbl of labels) {
              const closed = await github.rest.issues.listForRepo({
                owner: context.repo.owner, repo: context.repo.repo,
                state: 'closed', labels: lbl, since,
                per_page: 100,
              });
              for (const i of closed.data) {
                if (i.pull_request) continue;
                const names = i.labels.map(l => typeof l === 'string' ? l : l.name);
                all.push({ number: i.number, title: i.title, labels: names });
              }
            }
            const seen = new Set();
            const dedup = all.filter(i => !seen.has(i.number) && seen.add(i.number));

            const autoResolved = dedup.filter(i => i.labels.includes('auto-resolved')).length;
            const needsHuman   = dedup.filter(i => i.labels.includes('needs-human')).length;
            const loops        = dedup.filter(i => i.labels.includes('loop-suspected')).length;
            const total        = dedup.length;
            const autoRate     = total > 0 ? (autoResolved/total*100).toFixed(1) : 'n/a';

            // Categorize by primary label
            const byLabel = {};
            for (const i of dedup) {
              const primary = i.labels.find(l => labels.includes(l)) || 'other';
              byLabel[primary] = (byLabel[primary]||0) + 1;
            }

            const lines = [];
            lines.push(`## Compass Agent Improvement Report — ${new Date().toISOString().slice(0,7)}`);
            lines.push('');
            lines.push(`**Total incidents resolved (last 30 days):** ${total}`);
            lines.push(`**Auto-resolved by doctor:** ${autoResolved} (${autoRate}%)`);
            lines.push(`**Required human:** ${needsHuman}`);
            lines.push(`**Suspected agent loops (caught):** ${loops}`);
            lines.push('');
            lines.push('### By incident class');
            lines.push('| Class | Count |');
            lines.push('|---|---:|');
            for (const [k,v] of Object.entries(byLabel).sort((a,b)=>b[1]-a[1])) {
              lines.push(`| \`${k}\` | ${v} |`);
            }
            lines.push('');
            const needsList = dedup.filter(i => i.labels.includes('needs-human')).slice(0, 10);
            if (needsList.length > 0) {
              lines.push("### Patterns the doctor still can't handle");
              lines.push('Each of these is a candidate for a new playbook entry:');
              for (const n of needsList) lines.push(`- #${n.number} ${n.title}`);
              lines.push('');
            }
            lines.push('### Improvement loop');
            lines.push('For each `needs-human` issue above, append a new pattern to `.doctor/playbook.md`. Goal next month: auto-resolution rate ↑ by ≥ 5 percentage points.');
            lines.push('');
            lines.push('---');
            lines.push(`_Auto-generated by \`.github/workflows/agent-improvement-monthly.yml\`. Operating standard: every month the doctor handles a higher % of incidents than the month before. Patterns never decrease._`);

            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `[improvement] Doctor capability report — ${new Date().toISOString().slice(0,7)}`,
              body: lines.join('\n'),
              labels: ['improvement', 'monthly-report'],
            });
