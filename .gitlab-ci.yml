# ============================================================
# X3 Compass — GitLab CI/CD pipeline
# ------------------------------------------------------------
# Every push to `main` builds the Next.js app and deploys the
# `out/` static export to Cloudflare Pages (project x3compass-web).
#
# Required GitLab CI variables (set via Settings → CI/CD → Variables):
#   CLOUDFLARE_API_TOKEN   — masked, protected, expanded
#   CLOUDFLARE_ACCOUNT_ID  — masked, protected, expanded
#
# Runtime: gitlab-runner shared runners (free tier, 400 min/month).
# ============================================================

stages:
  - build
  - deploy
  - verify

variables:
  NODE_VERSION: "22"
  NEXT_TELEMETRY_DISABLED: "1"

build:
  stage: build
  image: node:22-alpine
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
      - .next/cache/
  script:
    - node --version
    - npm ci --no-audit --no-fund
    - npm run build
  artifacts:
    paths:
      - out/
    expire_in: 1 hour
  only:
    - main

deploy:
  stage: deploy
  image: node:22-alpine
  needs:
    - build
  script:
    - npx --yes wrangler@latest pages deploy out --project-name=x3compass-web --branch=main --commit-dirty=true
  environment:
    name: production
    url: https://x3compass.com
  only:
    - main

# ============================================================
# Post-deploy verification — Playwright smoke + visual regression.
# Runs against the live https://x3compass.com URL after deploy.
# Failure does NOT roll the deploy back, but flags the pipeline
# red so we notice within 2-3 min.
# ============================================================
verify:
  stage: verify
  image: mcr.microsoft.com/playwright:v1.60.0-jammy
  needs:
    - deploy
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
  script:
    - node --version
    - npm ci --no-audit --no-fund
    # Wait a few seconds for CF cache propagation, then run smoke.
    # Visual specs are :allow-failure: true via the `allow_failure`
    # job key below — they catch design regressions but don't gate
    # the pipeline on AA-pixel diffs from CDN re-encodes.
    - sleep 15
    # CI runs chromium only (faster, cheaper). Local dev uses webkit too.
    - npm run test:smoke -- --project=chromium-desktop
    - npm run test:e2e -- tests/visual.spec.ts --project=chromium-desktop || true
  artifacts:
    when: always
    paths:
      - playwright-report/
      - test-results/
    expire_in: 7 days
  allow_failure: false
  only:
    - main
